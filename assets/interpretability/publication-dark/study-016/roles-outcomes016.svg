<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990"><rect width="100%" height="100%" fill="#11151a"/>
<text x="35" y="56" font-family="DejaVu Sans" font-size="34" fill="#e7e8e4">016 | Safe against every reply, different against random replies</text>
<text x="35" y="103" font-family="DejaVu Sans" font-size="23" fill="#e7e8e4">Exact offline game-DAG enumeration. Human: uniform among all legal squares on every turn.</text>
<text x="35" y="137" font-family="DejaVu Sans" font-size="20" fill="#a6b0b7">Three frozen policies, two player roles, no opening sampler. Green / blue / amber = wins; grey = draws.</text>
<text x="40" y="213" font-family="DejaVu Sans" font-size="28" fill="#e7e8e4">Model X (first)</text>
<text x="40" y="267" font-family="DejaVu Sans" font-size="22" fill="#82d5a1">Accepted raw priority</text>
<rect x="40" y="285" width="715" height="32" fill="#303c49" stroke="none"/>
<rect x="40" y="285" width="707.5520833333334" height="32" fill="#82d5a1" stroke="none"/>
<text x="40" y="351" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">Win 95/96 | Draw 1/96 | Loss 0</text>
<text x="40" y="379" font-family="DejaVu Sans" font-size="18" fill="#a6b0b7">E[marks] 93/16 | 108 supported histories</text>
<text x="40" y="427" font-family="DejaVu Sans" font-size="22" fill="#7fb7e3">Reversed priority</text>
<rect x="40" y="445" width="715" height="32" fill="#303c49" stroke="none"/>
<rect x="40" y="445" width="707.5520833333334" height="32" fill="#7fb7e3" stroke="none"/>
