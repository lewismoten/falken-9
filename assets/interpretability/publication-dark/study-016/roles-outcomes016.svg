<text x="40" y="539" font-family="DejaVu Sans" font-size="18" fill="#a6b0b7">E[marks] 659/96 | 187 supported histories</text>
<text x="40" y="587" font-family="DejaVu Sans" font-size="22" fill="#eda85f">Largest score (offline)</text>
<rect x="40" y="605" width="715" height="32" fill="#303c49" stroke="none"/>
<rect x="40" y="605" width="707.5520833333334" height="32" fill="#eda85f" stroke="none"/>
<text x="40" y="671" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">Win 95/96 | Draw 1/96 | Loss 0</text>
<text x="40" y="699" font-family="DejaVu Sans" font-size="18" fill="#a6b0b7">E[marks] 211/32 | 167 supported histories</text>
