<text x="830" y="671" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">Win 814/945 | Draw 131/945 | Loss 0</text>
<text x="830" y="699" font-family="DejaVu Sans" font-size="18" fill="#a6b0b7">E[marks] 6623/945 | 589 supported histories</text>
<text x="35" y="780" font-family="DejaVu Sans" font-size="25" fill="#82d5a1">A  All six: no losing history, even when every legal human reply is treated adversarially.</text>
<text x="35" y="832" font-family="DejaVu Sans" font-size="22" fill="#e7e8e4">B  As X: equal win probability, different lengths and histories. As O: accepted wins most of these three.</text>
<text x="35" y="880" font-family="DejaVu Sans" font-size="20" fill="#a6b0b7">Largest-score is an offline counterfactual, not confidence, deployed behavior, or an optimized best response.</text>
<text x="35" y="920" font-family="DejaVu Sans" font-size="20" fill="#a6b0b7">Supported histories are not equiprobable; legal-choice denominators change along a game.</text>
<text x="35" y="960" font-family="DejaVu Sans" font-size="20" fill="#a6b0b7">These exact probabilities apply only to the declared uniformly random legal opponent.</text>
</svg>
