<text x="727" y="1003" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">Set {cf}; ebdfhcgia → f</text>
<text x="727" y="1031" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">Inverse-map WHOLE set before raw ties,</text>
<text x="727" y="1059" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">never rotate one already chosen move.</text>
<text x="30" y="1141" font-family="DejaVu Sans" font-size="21" fill="#e7e8e4">Numerical execution is not semantic attribution. No “block/fork expert” claim without selective evidence.</text>
