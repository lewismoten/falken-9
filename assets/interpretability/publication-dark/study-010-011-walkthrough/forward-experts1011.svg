<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190"><rect width="100%" height="100%" fill="#11151a"/>
<text x="30" y="47" font-family="DejaVu Sans" font-size="29" fill="#e7e8e4">One actual frozen forward | 2 / 2 | Routed experts → head → wrapper</text>
<text x="30" y="97" font-family="DejaVu Sans" font-size="21" fill="#e7e8e4">E/F/G: learned integer computation. H: fixed masking, inverse coordinates and raw-board tie priority.</text>
