<text x="710" y="192" font-family="DejaVu Sans" font-size="24" fill="#e7e8e4">Ideal abstraction</text>
<text x="710" y="233" font-family="DejaVu Sans" font-size="18" fill="#e7e8e4">72 allowed directed transitions; diagonal forbidden.</text>
<text x="710" y="272" font-family="DejaVu Sans" font-size="18" fill="#e7e8e4">P(next=j | previous=i) = 1/8 for j != i.</text>
<text x="710" y="311" font-family="DejaVu Sans" font-size="18" fill="#e7e8e4">Uniform stationary marginal = 1/9 per opening.</text>
<text x="710" y="350" font-family="DejaVu Sans" font-size="18" fill="#e7e8e4">Ideal law is conditional on sample success.</text>
<text x="710" y="389" font-family="DejaVu Sans" font-size="18" fill="#e7e8e4">Correlated, not independent sampling.</text>
<text x="710" y="428" font-family="DejaVu Sans" font-size="18" fill="#e7e8e4">Actual source-seeded host sequence</text>
<text x="710" y="467" font-family="DejaVu Sans" font-size="18" fill="#e7e8e4">One transient transition, then a 248-event cycle.</text>
<text x="710" y="506" font-family="DejaVu Sans" font-size="18" fill="#e7e8e4">26/72 transitions appear in the cycle; 27/72 incl. transient.</text>
<text x="710" y="545" font-family="DejaVu Sans" font-size="18" fill="#e7e8e4">Fixed cycle frequencies below are NOT uniform.</text>
<text x="710" y="584" font-family="DejaVu Sans" font-size="18" fill="#e7e8e4">This is code-state enumeration, not a fairness test.</text>
<text x="710" y="669" font-family="DejaVu Sans Mono" font-size="17" fill="#e7e8e4">opening      1   2   3   4   5   6   7   8   9</text>
<text x="710" y="707" font-family="DejaVu Sans Mono" font-size="17" fill="#e7e8e4">events     31  31  31  16  17  29  41  31  21</text>
<text x="710" y="748" font-family="DejaVu Sans" font-size="17" fill="#e7e8e4">denominator = 248 for each fixed-cycle frequency</text>
<text x="30" y="866" font-family="DejaVu Sans" font-size="21" fill="#e7e8e4">I | First session game opens 5 deterministically; next 12 source-emulated openings:</text>
<text x="30" y="912" font-family="DejaVu Sans Mono" font-size="24" fill="#e7e8e4">3 -&gt; 6 -&gt; 7 -&gt; 8 -&gt; 7 -&gt; 8 -&gt; 3 -&gt; 6 -&gt; 2 -&gt; 1 -&gt; 5 -&gt; 7</text>
