<text x="30" y="1011" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">Self-cutpoint controls reproduce every coarse stage; clean code restoration reproduces every baseline stage.</text>
<text x="30" y="1046" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">Restoring merged is a downstream sufficiency check with unchanged head, not proof of a unique circuit.</text>
<text x="30" y="1081" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">Packet-derived host diagnostic only. Stored weights are static; activations/routes depend on the board.</text>
