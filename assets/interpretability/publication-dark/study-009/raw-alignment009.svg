<text x="45" y="595" font-family="DejaVu Sans" font-size="21" fill="#e7e8e4">Raw priority: [4,1,3,5,7,2,6,8,0]. Inverse-transform the COMPLETE set, then apply priority.</text>
<text x="45" y="640" font-family="DejaVu Sans" font-size="22" fill="#e7e8e4">Raw orbit: 4 wrong moves / 8 boards; do not multiply canonical errors by eight.</text>
