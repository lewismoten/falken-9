<text x="45" y="853" font-family="DejaVu Sans Mono" font-size="19" fill="#e7e8e4">W8 : [14944, -196092, -230653, -7577, -107259, 41138, 420049, -118292, 184306]</text>
<text x="45" y="891" font-family="DejaVu Sans" font-size="19" fill="#e7e8e4">Legal sign crossings: [0] (green denotes set membership, not a preference ranking).</text>
<text x="30" y="955" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">Actual public predict_history wrapper executed on all 4520 raw boards with test-only canonical logits.</text>
<text x="30" y="991" font-family="DejaVu Sans" font-size="20" fill="#e7e8e4">627 canonical neural forwards per variant were recomputed in full. This is a composed host proof, not target speed.</text>
