<text x="28" y="934" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#aab9c6">C = norm2_output[7] half: 106 ordered-route changes and 530 gate-vector changes /627. A restoration rescues 2/50 covered upstream failures but creates</text>
