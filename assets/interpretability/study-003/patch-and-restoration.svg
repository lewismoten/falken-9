<text x="580" y="313" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#aab9c6">Matched unit E3.h0: same 1/3; cross 2/12</text>
<text x="580" y="350" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#aab9c6">These donor pools are small and differ. No semantic-transfer effect is established: same-class</text>
<text x="580" y="373" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#aab9c6">donors also harm, cross-class donors often do not. Activation magnitude/context, not task</text>
<text x="580" y="396" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#aab9c6">membership alone, matters.</text>
<text x="46" y="461" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#aab9c6">E1.h0 fork patches: NO positive same-class receivers; cross-class reaches only 2 fork-positive test boards and causes 0 bad moves. That is a coverage failure, not</text>
<text x="46" y="483" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#aab9c6">evidence for/against a fork circuit.</text>
