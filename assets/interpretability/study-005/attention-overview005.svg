<text x="829" y="898" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#aab9c6">Identity/no-op has exact all-stage parity. Group controls move equal per-row mass over equally</text>
<text x="829" y="921" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#aab9c6">many disjoint edges, but may affect other lines. Substantial control damage prevents a dedicated</text>
<text x="829" y="944" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#aab9c6">line-circuit conclusion.</text>
<text x="28" y="1043" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#aab9c6">Selection folds372/121/134 are NOT model-heldout. Full-set logits are candidate membership scores, not probabilities.</text>
