<rect x="24" y="550" width="760" height="475" fill="#182330" stroke="#405368" stroke-width="1"/>
<text x="42" y="568" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#eda85f">B / position and occupancy controls</text>
<text x="42" y="612" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#aab9c6">Local Q/K/V are exactly determined by square, local occupancy and side:</text>
<text x="42" y="637" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#aab9c6">within-ply/square/own-opponent occupancy MSE =0. This is architectural</text>
<text x="42" y="662" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#aab9c6">locality, NOT a whole-board tactical detector.</text>
<text x="42" y="731" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#aab9c6">Actual P still varies across boards in fixed ply/query/key/own-opponent</text>
<text x="42" y="756" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#aab9c6">occupancy strata: within-MSE 5,203,803.6 (Q15 squared). Normalization</text>
<text x="42" y="781" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#aab9c6">depends on all keys; actual P times V and projection also depend on</text>
<text x="42" y="806" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#aab9c6">input.</text>
<text x="42" y="881" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#aab9c6">All query rows feed a flattened global readout plus residual. Query q is</text>
<text x="42" y="906" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#aab9c6">NOT output square q. Legal occupied masking and final full-set</text>
<text x="42" y="931" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#aab9c6">inverse/tie rules are external and not learned.</text>
