<rect width="100%" height="100%" fill="#101720"/>
<text x="28" y="20" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="26" fill="#edf2f6">Study005 / input-sensitive attention, not an established strategy detector</text>
<text x="28" y="61" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#aab9c6">Measured actual model on627 canonical boards; perturbations are isolated upstream OOD overrides, never deployed behavior.</text>
<rect x="24" y="102" width="760" height="430" fill="#182330" stroke="#405368" stroke-width="1"/>
<text x="42" y="120" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#eda85f">A / actual attention distribution</text>
<text x="42" y="162" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#edf2f6">Row entropy mean 1.5554 / 3.1699 bits</text>
<text x="42" y="194" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#edf2f6">Range 0.0234 to 3.0476; effective keys mean 3.423</text>
<text x="42" y="225" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#edf2f6">Zero edges 9.41%; mean row maximum P 0.5996</text>
