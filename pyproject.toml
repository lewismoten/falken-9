[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falken-9"
version = "0.1.0"
description = "C64-first attention/MoE tic-tac-toe policy research"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.setuptools.packages.find]
include = ["falken9*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
