<text x="45" y="891" font-family="DejaVu Sans" font-size="19" fill="#17283f">Legal sign crossings: [0] (green denotes set membership, not a preference ranking).</text>
<text x="30" y="955" font-family="DejaVu Sans" font-size="20" fill="#17283f">Actual public predict_history wrapper executed on all 4520 raw boards with test-only canonical logits.</text>
<text x="30" y="991" font-family="DejaVu Sans" font-size="20" fill="#17283f">627 canonical neural forwards per variant were recomputed in full. This is a composed host proof, not target speed.</text>
