<text x="45" y="422" font-family="DejaVu Sans" font-size="22" fill="#17283f">B  Actual integer stage board_value at [2, 5]</text>
<text x="45" y="457" font-family="DejaVu Sans Mono" font-size="20" fill="#17283f">rounded output 1505 -&gt; 1552; row dots 49312221 -&gt; 198626</text>
<text x="45" y="494" font-family="DejaVu Sans Mono" font-size="20" fill="#17283f">baseline routes [2, 3], gates [32429, 339]  -&gt;  coarse routes [2, 3], gates [31670, 1098]</text>
<text x="45" y="531" font-family="DejaVu Sans" font-size="20" fill="#17283f">Routes are ordered expert IDs; gates Q15 sum to 32768. Unselected expert outputs are unobserved.</text>
<rect x="28" y="580" width="1500" height="185" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/>
<text x="45" y="614" font-family="DejaVu Sans" font-size="22" fill="#17283f">C  Dynamic activations and signed legal membership (not categorical preference)</text>
