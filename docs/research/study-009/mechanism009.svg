<text x="45" y="689" font-family="DejaVu Sans Mono" font-size="19" fill="#17283f">merged W8 : [-2203, -4000, 4688, -4228, -2787, 2394, -1176, 2984]</text>
<text x="45" y="729" font-family="DejaVu Sans" font-size="19" fill="#17283f">legal sign crossings: [0]  |  occupied crossings do not enter the legal set</text>
<rect x="28" y="786" width="1500" height="185" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/>
<text x="45" y="820" font-family="DejaVu Sans" font-size="22" fill="#17283f">D  Nine actual final scores: square indices 0..8, accepted iff empty and score &gt;= 0</text>
<text x="45" y="857" font-family="DejaVu Sans Mono" font-size="19" fill="#17283f">W16: [17305, -14051, -53713, -24052, 35639, -38007, -18017, -33805, -38345]</text>
<text x="45" y="894" font-family="DejaVu Sans Mono" font-size="19" fill="#17283f">W8 : [-8116, -7860, -46806, -33238, 30538, -49300, -21993, -17350, -26408]</text>
<text x="45" y="931" font-family="DejaVu Sans Mono" font-size="19" fill="#17283f">Rtr: [15354, -6539, -42318, -22579, 34049, -38477, -20093, -23406, -25613]</text>
<text x="30" y="1011" font-family="DejaVu Sans" font-size="20" fill="#17283f">Self-cutpoint controls reproduce every coarse stage; clean code restoration reproduces every baseline stage.</text>
<text x="30" y="1046" font-family="DejaVu Sans" font-size="20" fill="#17283f">Restoring merged is a downstream sufficiency check with unchanged head, not proof of a unique circuit.</text>
<text x="30" y="1081" font-family="DejaVu Sans" font-size="20" fill="#17283f">Packet-derived host diagnostic only. Stored weights are static; activations/routes depend on the board.</text>
