<text x="32" y="678" font-family="DejaVu Sans" font-size="23" fill="#17283f">C  The direct path has 485 empty sets + 1,151 nonoptimal nonempty choices.</text>
<text x="32" y="720" font-family="DejaVu Sans" font-size="23" fill="#17283f">345 different but optimal tie choices are not errors. Full-set changes: 3,006 / 4,520.</text>
<text x="32" y="762" font-family="DejaVu Sans" font-size="23" fill="#17283f">Only 14 / 627 canonical boards keep the exact set under every direct D4 orientation.</text>
<text x="32" y="804" font-family="DejaVu Sans" font-size="23" fill="#17283f">5,016 orbit observations reuse 4,520 inputs; stabilizers are not independent evidence.</text>
