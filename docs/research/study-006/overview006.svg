<text x="30" y="735" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#aab9c6">B / All six renormalized pairs preserve full sets on 19/627 boards; at least one pair does so on 627/627.</text>
<text x="30" y="771" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#aab9c6">Training-only fixed pair: [2, 3]. Offline all-expert evaluation:2508 outputs vs1254 normally executed; additional1254 are not deployed compute.</text>
<text x="30" y="807" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#aab9c6">Pair+gate reversal is exact; reversing only the pair changes expert-to-gate assignment. Alternative pairs are not proposed trained policies.</text>
