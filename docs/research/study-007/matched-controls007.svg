<text x="45" y="857" dominant-baseline="hanging" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#aab9c6">Training necessity ranking uses all active neutral training boards, not exact geometry-matched neutral ranking controls. Natural donor matching is geometric.</text>
