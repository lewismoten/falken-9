<text x="675" y="803" font-family="DejaVu Sans" font-size="22" fill="#17283f">The full integer logits are NOT identical.</text>
<text x="675" y="836" font-family="DejaVu Sans" font-size="22" fill="#17283f">No full-logit collision on all 627 boards.</text>
<text x="675" y="869" font-family="DejaVu Sans" font-size="22" fill="#17283f">Sign equality is weaker than logit equality.</text>
<text x="30" y="1020" font-family="DejaVu Sans" font-size="20" fill="#17283f">Geometry controls: own/opponent corner, edge, center counts. Tactical labels describe geometry;</text>
